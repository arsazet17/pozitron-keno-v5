name: KENO · FIX FINGERPRINT BOOLEAN

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keno-v624-fix-bolean
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Sync main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Исправить Boolean и синхронизировать build
        run: |
          node scripts/fix-bolean-v624.mjs
          node refresh-asset-versions.mjs

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fingerprint-v622.js index.html version-v622.json manifest.webmanifest

          if git diff --cached --quiet; then
            echo "Исправление уже применено"
            exit 0
          fi

          git commit -m "KENO 6.2.4: fix FINGERPRINT Bolean typo and bump cache version"
          git pull --rebase origin main
          git push origin HEAD:main
