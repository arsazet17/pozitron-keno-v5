name: KENO 6.2 · ARCHIVE REAL DRAW ORDER

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "patch-fingerprint-real-order.mjs"
      - ".github/workflows/fingerprint-real-order.yml"

permissions:
  contents: write

concurrency:
  group: keno-62-fingerprint-real-order
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Исправить Вып Возр Вм по фактическому тиражу
        run: node patch-fingerprint-real-order.mjs

      - name: Сохранить fingerprint и index
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- fingerprint-v622.js index.html; then
            echo "Уже установлено"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fingerprint-v622.js index.html
          git commit -m "KENO 6.2 · FINGERPRINT real draw order"
          git push origin HEAD:main
