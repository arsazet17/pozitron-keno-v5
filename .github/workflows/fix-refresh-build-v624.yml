name: KENO 6.2.4 · FIX REFRESH BUILD

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keno-v624-fix-refresh-build
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Sync main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fix FINGERPRINT and force new client build
        env:
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');

          const build=String(process.env.BUILD_ID || Date.now());
          const now=new Date().toISOString();

          let fp=fs.readFileSync('fingerprint-v622.js','utf8');
          fp=fp.replaceAll('.filter(Bolean)', '.filter(Boolean)');
          fs.writeFileSync('fingerprint-v622.js',fp,'utf8');

          let html=fs.readFileSync('index.html','utf8');

          const assets=[
            'cluster-model-v622.js',
            'cluster-tracker-v622.js',
            'fingerprint-v622.js',
            'app-version-v622.js',
            'manifest.webmanifest'
          ];

          for(const file of assets){
            const esc=file.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
            const re=new RegExp(`(${esc})(?:\\?v=[^"'<>\\s]*)?`,'g');
            html=html.replace(re, `$1?v=${build}`);
          }

          if(!/http-equiv=["']Cache-Control["']/i.test(html)){
            html=html.replace(
              '<head>',
              `<head>
          <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
          <meta http-equiv="Pragma" content="no-cache">
          <meta http-equiv="Expires" content="0">`
            );
          }

          fs.writeFileSync('index.html',html,'utf8');

          const version={
            app:'KENO 6.2.4',
            build,
            updatedAt:now,
            runId:process.env.GITHUB_RUN_ID || null,
            runAttempt:process.env.GITHUB_RUN_ATTEMPT || null,
            sha:process.env.GITHUB_SHA || null
          };
          fs.writeFileSync('version-v622.json',JSON.stringify(version,null,2)+'\n','utf8');

          console.log('NEW CLIENT BUILD',build);
          NODE

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            fingerprint-v622.js \
            index.html \
            version-v622.json

          if git diff --cached --quiet; then
            echo "Нет изменений"
            exit 0
          fi

          git commit -m "KENO 6.2.4: force fresh FINGERPRINT client build"

          if git push origin HEAD:main; then
            exit 0
          fi

          git pull --rebase origin main
          git push origin HEAD:main
