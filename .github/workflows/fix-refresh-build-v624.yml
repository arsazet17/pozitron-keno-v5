name: KENO · MANUAL REFRESH BUILD

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keno-manual-refresh-build
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Синхронизировать build из единой версии
        run: |
          node --check refresh-asset-versions.mjs
          node refresh-asset-versions.mjs

      - name: Сохранить build без изменения номера версии
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version-v622.json manifest.webmanifest

          if git diff --cached --quiet; then
            echo "Build уже актуален"
            exit 0
          fi

          git commit -m "KENO · refresh client build"
          git pull --rebase origin main
          git push origin HEAD:main
