name: KENO v6.2 · Stoloto MAIN · FAST FACT CHROME

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: keno-v622-stoloto
  cancel-in-progress: false

jobs:
  stoloto-main:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Синхронизировать актуальный main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          echo "Работаем от актуального main: $(git rev-parse HEAD)"

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Подготовить Playwright БЕЗ скачивания Chromium
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f package.json ]; then
            npm init -y >/dev/null 2>&1
          fi

          npm install --no-audit --no-fund --ignore-scripts playwright

          CHROME=""
          for p in \
            /usr/bin/google-chrome \
            /usr/bin/google-chrome-stable \
            /usr/bin/chromium \
            /usr/bin/chromium-browser
          do
            if [ -x "$p" ]; then
              CHROME="$p"
              break
            fi
          done

          if [ -z "$CHROME" ]; then
            echo "Системный Chrome на runner не найден" >&2
            exit 1
          fi

          echo "STOLOTO_CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          echo "Используем системный Chrome: $CHROME"

      # СРАЗУ reader — хвост 10 как M5M.
      - name: Столото · M5M tail10 · FAST READ
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
          STOLOTO_CHROME_PATH: ${{ env.STOLOTO_CHROME_PATH }}
        run: node stoloto-keno-update-v62.mjs

      - name: Проверить, появился ли новый тираж
        id: fresh
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- keno-history-v62.json; then
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            echo "Нового тиража нет"
          else
            echo "has_new=true" >> "$GITHUB_OUTPUT"
            echo "Новый тираж найден — публикуем ФАКТ сейчас"
          fi

      # Статус сохраняется даже без нового факта — видно каждый запуск.
      - name: Сохранить status без нового факта
        if: steps.fresh.outputs.has_new != 'true'
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- keno-status-v62.json; then
            echo "Status не изменился"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add keno-status-v62.json
          git commit -m "KENO · reader status · новых тиражей нет"

          git pull --rebase origin main
          git push origin HEAD:main

      - name: СРАЗУ сохранить новый факт в GitHub
        if: steps.fresh.outputs.has_new == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add keno-history-v62.json keno-status-v62.json
          git commit -m "KENO · FAST FACT · новый тираж Столото"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "ФАКТ ОПУБЛИКОВАН"
              exit 0
            fi
            [ "$attempt" -lt 3 ] && sleep 2
          done

          echo "Не удалось быстро опубликовать новый факт" >&2
          exit 1

      - name: Отдельно запустить тяжёлые модели
        if: steps.fresh.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run keno-v622-server.yml --ref main
          gh workflow run vertical-radar-v624-server.yml --ref main
          echo "ФАКТ опубликован; тяжёлые модели запущены отдельно"
