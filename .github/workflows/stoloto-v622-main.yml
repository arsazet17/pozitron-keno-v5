name: KENO v6.2 · Stoloto MAIN · FAST FACT

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keno-v622-stoloto
  cancel-in-progress: false

jobs:
  stoloto-main:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Синхронизировать актуальный main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          echo "Работаем от актуального main: $(git rev-parse HEAD)"

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установить Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Подготовить движок нижних прогнозов
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/keno-v622-server.yml')
          if not workflow.exists():
              raise SystemExit('Нет .github/workflows/keno-v622-server.yml')

          text = workflow.read_text(encoding='utf-8')
          match = re.search(
              r"(?ms)^[ \t]*cat > /tmp/keno-v622-server\.mjs <<'NODE'[ \t]*\n(.*?)^[ \t]*NODE[ \t]*$",
              text,
          )
          if not match:
              raise SystemExit('Не найден встроенный движок keno-v622-server.mjs')

          code = textwrap.dedent(match.group(1)).strip('\n') + '\n'
          target = Path('/tmp/keno-v622-server.mjs')
          target.write_text(code, encoding='utf-8')
          print(f'Движок нижних прогнозов подготовлен: {len(code)} байт')
          PY
          node --check /tmp/keno-v622-server.mjs

      # ------------------------------------------------------------
      # ЭТАП 1. ТОЛЬКО ФАКТ СТОЛОТО.
      # Никакие прогнозы ещё не считаются.
      # ------------------------------------------------------------
      - name: Столото · OAuth · 3 независимых чтения
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
        run: node stoloto-keno-update-v62.mjs

      - name: Проверить, появился ли новый тираж
        id: fresh
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- keno-history-v62.json; then
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            echo "Нового тиража нет — тяжёлые прогнозы НЕ запускаем"
          else
            echo "has_new=true" >> "$GITHUB_OUTPUT"
            echo "Новый тираж найден — сначала публикуем ФАКТ"
          fi

      # ------------------------------------------------------------
      # ГЛАВНОЕ ИСПРАВЛЕНИЕ:
      # новый факт публикуется СРАЗУ, до FINGERPRINT и прогнозов.
      # ------------------------------------------------------------
      - name: СРАЗУ сохранить новый факт в GitHub
        if: steps.fresh.outputs.has_new == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add keno-history-v62.json keno-status-v62.json
          git commit -m "KENO · FAST FACT · новый тираж Столото"

          for attempt in 1 2 3; do
            echo "Публикация факта: попытка ${attempt}/3"

            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "ФАКТ ОПУБЛИКОВАН. Приложение уже может его получить."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 2
            fi
          done

          echo "Не удалось быстро опубликовать новый факт" >&2
          exit 1

      # После быстрого push рабочая копия синхронизируется с новым main.
      - name: Синхронизировать main после публикации факта
        if: steps.fresh.outputs.has_new == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      # ------------------------------------------------------------
      # ЭТАП 2. ТЯЖЁЛЫЕ РАСЧЁТЫ — ТОЛЬКО ПОСЛЕ ПУБЛИКАЦИИ ФАКТА.
      # ------------------------------------------------------------
      - name: Пересчитать 🎯 / −1 / −2
        if: steps.fresh.outputs.has_new == 'true'
        run: node /tmp/keno-v622-server.mjs

      - name: Пересчитать FINGERPRINT · LOGIC / ANTILOGIC
        if: steps.fresh.outputs.has_new == 'true'
        run: |
          set -euo pipefail
          node scripts/fingerprint-v622-server.mjs

      # Старый bump оставлен как есть, чтобы этим изменением
      # не вмешиваться одновременно в отдельную систему версии.
      - name: Обновить текущий client build
        if: steps.fresh.outputs.has_new == 'true'
        env:
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/bump-client-version-v622.mjs

      - name: Сохранить прогнозы и FINGERPRINT вторым обновлением
        if: steps.fresh.outputs.has_new == 'true'
        shell: bash
        env:
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILES=(
            cluster-archive-next-v622.json
            cluster-archive-minus1-v622.json
            cluster-archive-minus2-v622.json

            fingerprint-archive-next-v622.json
            fingerprint-archive-minus1-v622.json
            fingerprint-archive-minus2-v622.json

            index.html
            version-v622.json
          )

          git add -- "${FILES[@]}"

          if git diff --cached --quiet; then
            echo "После публикации факта дополнительных изменений нет"
            exit 0
          fi

          git commit -m "KENO · прогнозы + FINGERPRINT после FAST FACT"

          for attempt in 1 2 3; do
            echo "Публикация прогнозов: попытка ${attempt}/3"

            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Прогнозы и FINGERPRINT опубликованы"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 2
            fi
          done

          echo "ФАКТ уже опубликован, но прогнозы не удалось сохранить после 3 попыток" >&2
          exit 1

      - name: Быстро завершить запуск без нового тиража
        if: steps.fresh.outputs.has_new != 'true'
        run: |
          echo "Нового факта нет."
          echo "🎯 / −1 / −2 и FINGERPRINT не запускались."
          echo "Workflow освобождает очередь для следующего внешнего cron."
