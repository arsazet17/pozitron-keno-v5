name: KENO v6.2 · Stoloto MAIN · FAST FACT CHROME

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keno-v622-stoloto
  cancel-in-progress: false

jobs:
  stoloto-main:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Синхронизировать актуальный main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          echo "Работаем от актуального main: $(git rev-parse HEAD)"

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # ------------------------------------------------------------
      # БЫСТРАЯ СРЕДА ДЛЯ READER:
      # браузер НЕ скачиваем. Используем Chrome GitHub runner.
      # ------------------------------------------------------------
      - name: Подготовить Playwright БЕЗ скачивания Chromium
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f package.json ]; then
            npm init -y >/dev/null 2>&1
          fi

          npm install --no-audit --no-fund --ignore-scripts playwright

          CHROME=""
          for p in \
            /usr/bin/google-chrome \
            /usr/bin/google-chrome-stable \
            /usr/bin/chromium \
            /usr/bin/chromium-browser
          do
            if [ -x "$p" ]; then
              CHROME="$p"
              break
            fi
          done

          if [ -z "$CHROME" ]; then
            echo "Системный Chrome на runner не найден" >&2
            exit 1
          fi

          echo "STOLOTO_CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          echo "Используем системный Chrome: $CHROME"

      # ------------------------------------------------------------
      # ЭТАП 1. СРАЗУ ЧИТАЕМ СТОЛОТО.
      # НИКАКИХ движков прогнозов до FAST FACT.
      # ------------------------------------------------------------
      - name: Столото · M5M tail10 · FAST READ
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
          STOLOTO_CHROME_PATH: ${{ env.STOLOTO_CHROME_PATH }}
        run: node stoloto-keno-update-v62.mjs

      - name: Проверить, появился ли новый тираж
        id: fresh
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- keno-history-v62.json; then
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            echo "Нового тиража нет"
          else
            echo "has_new=true" >> "$GITHUB_OUTPUT"
            echo "Новый тираж найден — публикуем ФАКТ сейчас"
          fi

      # Даже если нового факта нет, status сохраняем для диагностики reader.
      - name: Сохранить status без нового факта
        if: steps.fresh.outputs.has_new != 'true'
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- keno-status-v62.json; then
            echo "Status не изменился"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add keno-status-v62.json
          git commit -m "KENO · reader status · новых тиражей нет"

          git pull --rebase origin main
          git push origin HEAD:main

      - name: СРАЗУ сохранить новый факт в GitHub
        if: steps.fresh.outputs.has_new == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add keno-history-v62.json keno-status-v62.json
          git commit -m "KENO · FAST FACT · новый тираж Столото"

          for attempt in 1 2 3; do
            echo "Публикация факта: попытка ${attempt}/3"

            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "ФАКТ ОПУБЛИКОВАН"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 2
            fi
          done

          echo "Не удалось быстро опубликовать новый факт" >&2
          exit 1

      - name: Синхронизировать main после FAST FACT
        if: steps.fresh.outputs.has_new == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      # ------------------------------------------------------------
      # ЭТАП 2. ТОЛЬКО ТЕПЕРЬ готовим и считаем прогнозы.
      # ------------------------------------------------------------
      - name: Подготовить движок нижних прогнозов
        if: steps.fresh.outputs.has_new == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/keno-v622-server.yml')
          if not workflow.exists():
              raise SystemExit('Нет .github/workflows/keno-v622-server.yml')

          text = workflow.read_text(encoding='utf-8')
          match = re.search(
              r"(?ms)^[ \t]*cat > /tmp/keno-v622-server\.mjs <<'NODE'[ \t]*\n(.*?)^[ \t]*NODE[ \t]*$",
              text,
          )
          if not match:
              raise SystemExit('Не найден встроенный движок keno-v622-server.mjs')

          code = textwrap.dedent(match.group(1)).strip('\n') + '\n'
          target = Path('/tmp/keno-v622-server.mjs')
          target.write_text(code, encoding='utf-8')
          print(f'Движок подготовлен: {len(code)} байт')
          PY
          node --check /tmp/keno-v622-server.mjs

      - name: Пересчитать 🎯 / −1 / −2
        if: steps.fresh.outputs.has_new == 'true'
        run: node /tmp/keno-v622-server.mjs

      - name: Пересчитать FINGERPRINT · LOGIC / ANTILOGIC
        if: steps.fresh.outputs.has_new == 'true'
        run: node scripts/fingerprint-v622-server.mjs

      - name: Обновить текущий client build
        if: steps.fresh.outputs.has_new == 'true'
        env:
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/bump-client-version-v622.mjs

      - name: Сохранить прогнозы и FINGERPRINT вторым обновлением
        if: steps.fresh.outputs.has_new == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILES=(
            cluster-archive-next-v622.json
            cluster-archive-minus1-v622.json
            cluster-archive-minus2-v622.json
            fingerprint-archive-next-v622.json
            fingerprint-archive-minus1-v622.json
            fingerprint-archive-minus2-v622.json
            index.html
            version-v622.json
          )

          git add -- "${FILES[@]}"

          if git diff --cached --quiet; then
            echo "После FAST FACT дополнительных изменений нет"
            exit 0
          fi

          git commit -m "KENO · прогнозы + FINGERPRINT после FAST FACT"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Прогнозы опубликованы"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 2
            fi
          done

          echo "ФАКТ уже опубликован, но прогнозы не сохранились" >&2
          exit 1
