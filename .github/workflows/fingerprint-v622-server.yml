name: KENO · FINGERPRINT SERVER ARCHIVE

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["KENO · HEAVY CLUSTER MODELS"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: fingerprint-v622-server-archive
  cancel-in-progress: false

jobs:
  build-fingerprint-archives:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get latest main
        run: git pull --rebase origin main

      - name: Build shared FINGERPRINT archives
        run: node scripts/fingerprint-v622-server.mjs

      - name: Commit shared FINGERPRINT archives
        shell: bash
        run: |
          if git diff --quiet -- fingerprint-archive-next-v622.json fingerprint-archive-minus1-v622.json fingerprint-archive-minus2-v622.json; then
            echo "No FINGERPRINT archive changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fingerprint-archive-next-v622.json fingerprint-archive-minus1-v622.json fingerprint-archive-minus2-v622.json
          git commit -m "Update shared FINGERPRINT archives"
          git pull --rebase origin main
          git push origin HEAD:main
