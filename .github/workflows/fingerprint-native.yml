name: KENO 6.2 · NATIVE FINGERPRINT PATCH

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "patch-fingerprint-native.mjs"
      - ".github/workflows/fingerprint-native.yml"

permissions:
  contents: write

concurrency:
  group: keno-62-native-fingerprint-patch
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Получить main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Исправить сам fingerprint-v622.js
        run: node patch-fingerprint-native.mjs

      - name: Сохранить FINGERPRINT и index.html
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- fingerprint-v622.js index.html; then
            echo "Уже исправлено"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fingerprint-v622.js index.html
          git commit -m "KENO 6.2 · native FINGERPRINT 4x5 + view buttons"
          git push origin HEAD:main
