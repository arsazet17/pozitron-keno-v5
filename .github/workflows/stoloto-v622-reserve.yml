name: KENO · Stoloto RESERVE

on:
  workflow_dispatch:
  schedule:
    # Резерв смещён относительно MAIN: :02,:07,:12...
    - cron: "2-59/5 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: keno-v622-stoloto
  cancel-in-progress: false

jobs:
  stoloto-reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Fresh main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Столото · M5M reader · резерв
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
        run: node stoloto-keno-update-v62.mjs

      - name: Проверить новый факт
        id: fresh
        shell: bash
        run: |
          if git diff --quiet -- keno-history-v62.json; then
            echo "has_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Сохранить обновление
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- keno-history-v62.json keno-status-v62.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keno-history-v62.json keno-status-v62.json
          git commit -m "KENO · Stoloto reserve update"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Запустить тяжёлые модели
        if: steps.fresh.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run keno-v622-server.yml --ref main
          gh workflow run vertical-radar-v624-server.yml --ref main
