name: KENO · Stoloto RESERVE

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: keno-v622-stoloto
  cancel-in-progress: false

jobs:
  stoloto-reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установить Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Столото · OAuth · 3 независимых чтения
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
        run: node stoloto-keno-update-v62.mjs

      - name: Проверить новый факт
        id: fresh
        shell: bash
        run: |
          if git diff --quiet -- keno-history-v62.json; then
            echo "has_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Сохранить обновление Столото
        shell: bash
        run: |
          if git diff --quiet -- keno-history-v62.json keno-status-v62.json; then
            echo "Новых подтверждённых данных нет"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keno-history-v62.json keno-status-v62.json
          git commit -m "KENO · Stoloto reserve update"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Отдельно запустить тяжёлые модели
        if: steps.fresh.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run keno-v622-server.yml --ref main
          gh workflow run vertical-radar-v624-server.yml --ref main
