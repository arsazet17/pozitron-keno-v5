name: KENO 6.2 · RESTORE FINGERPRINT BUTTON

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "fix-fingerprint-button.mjs"
      - ".github/workflows/fix-fingerprint-button.yml"

permissions:
  contents: write

concurrency:
  group: keno-62-restore-fingerprint-button
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Исправить render и вернуть кнопку FINGERPRINT
        run: node fix-fingerprint-button.mjs

      - name: Сохранить изменения
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- fingerprint-v622.js index.html; then
            echo "Уже исправлено"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fingerprint-v622.js index.html
          git commit -m "KENO 6.2 · restore FINGERPRINT button"
          git push origin HEAD:main
