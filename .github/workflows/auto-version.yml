name: KENO 6.2 · AUTO VERSION

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "cluster-model-v622.js"
      - "cluster-tracker-v622.js"
      - "fingerprint-v622.js"
      - "app-version-v622.js"
      - "manifest.webmanifest"
      - "refresh-asset-versions.mjs"
      - ".github/workflows/auto-version.yml"

permissions:
  contents: write

concurrency:
  group: keno-62-auto-version
  cancel-in-progress: true

jobs:
  version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Проверить JS
        run: |
          node --check fingerprint-v622.js
          node --check app-version-v622.js
          node --check cluster-model-v622.js
          node --check cluster-tracker-v622.js
          node --check refresh-asset-versions.mjs

      - name: Поднять версию и пересчитать build
        run: node refresh-asset-versions.mjs

      - name: Сохранить новую версию
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html version-v622.json manifest.webmanifest

          if git diff --cached --quiet; then
            echo "Изменений нет"
            exit 0
          fi

          git commit -m "KENO · AUTO VERSION"
          git push origin HEAD:main
