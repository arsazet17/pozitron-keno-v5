name: KENO 6.2 · AUTO INSTALL + VERSION

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "k62-ui-patch.js"
      - "k62-ui-patch.css"
      - "install-k62-ui-patch.mjs"
      - "refresh-asset-versions.mjs"
      - ".github/workflows/auto-version.yml"

permissions:
  contents: write

concurrency:
  group: keno-62-auto-install-version
  cancel-in-progress: true

jobs:
  install-and-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Получить актуальный main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Автоматически подключить PATCH в index.html
        run: node install-k62-ui-patch.mjs

      - name: Автоматически обновить версии ?v=
        run: node refresh-asset-versions.mjs

      - name: Сохранить готовый index.html
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- index.html; then
            echo "index.html уже подключён и версии актуальны"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html
          git commit -m "KENO 6.2 · AUTO install UI patch + cache version"
          git push origin HEAD:main
