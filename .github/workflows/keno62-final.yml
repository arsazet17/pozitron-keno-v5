name: KENO 6.2 · FINAL CLEAN + AUTO VERSION

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "finalize-keno62.mjs"
      - "fingerprint-v622.js"
      - "cluster-model-v622.js"
      - "cluster-tracker-v622.js"
      - "app-version-v622.js"
      - "k62-ui-patch.js"
      - "k62-ui-patch.css"
      - "manifest.webmanifest"
      - "refresh-asset-versions.mjs"
      - ".github/workflows/keno62-final.yml"

permissions:
  contents: write

concurrency:
  group: keno-62-final-clean
  cancel-in-progress: true

jobs:
  final:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Финальная очистка приложения
        run: node finalize-keno62.mjs

      - name: Проверка JS
        run: |
          node --check fingerprint-v622.js
          node --check k62-ui-patch.js

      - name: Автоматическая версия
        run: node refresh-asset-versions.mjs

      - name: Сохранить чистую сборку
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Изменений нет"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "KENO 6.2 · final clean build"
          git push origin HEAD:main
