name: KENO v6.2 Auto Update

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-keno-v62
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update KENO v6.2 history
        run: node keno-update-v62.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keno-history-v62.json keno-status-v62.json
          if git diff --cached --quiet; then
            echo "No new draws"
          else
            git commit -m "Auto-update KENO v6.2 data"
            git push
          fi
