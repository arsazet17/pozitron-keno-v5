name: KENO 6.2 · COLLECT OLD PATCHES

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "collect-old-patches.mjs"
      - ".github/workflows/collect-old-patches.yml"

permissions:
  contents: write

concurrency:
  group: keno-62-collect-old-patches
  cancel-in-progress: true

jobs:
  collect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Собрать старые файлы в одну папку
        run: node collect-old-patches.mjs

      - name: Сохранить перемещение
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Нечего переносить"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "KENO 6.2 · collect obsolete patches into one folder"
          git push origin HEAD:main
